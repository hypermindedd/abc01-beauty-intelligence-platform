name: ABC G0 Payload Audit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit staged payload
        shell: bash
        run: |
          set -euo pipefail
          echo "parts=$(find bootstrap -maxdepth 1 -type f -name 'payload.part*' | wc -l)"
          cat bootstrap/payload.part* > /tmp/payload.b64
          echo "base64_bytes=$(wc -c < /tmp/payload.b64)"
          base64 -d /tmp/payload.b64 > /tmp/payload.bin
          echo "decoded_bytes=$(wc -c < /tmp/payload.bin)"
          file /tmp/payload.bin
          if gzip -t /tmp/payload.bin; then
            echo "GZIP_TEST=PASS"
          else
            echo "GZIP_TEST=FAIL"
            exit 22
          fi
          if tar -tzf /tmp/payload.bin > /tmp/tarlist 2>/tmp/tarerr; then
            echo "TAR_TEST=PASS"
            echo "tar_count=$(wc -l < /tmp/tarlist)"
            head -100 /tmp/tarlist
          else
            echo "TAR_TEST=FAIL"
            cat /tmp/tarerr
          fi
